<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iMENA Tech — 3D Universe</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Fira+Code&display=swap" rel="stylesheet" />

    <style>
        /* ————— Reset & Base ————— */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000004;
            color: #fff;
            overflow-x: hidden;
            overflow-y: scroll;
            height: 100vh;
            scrollbar-width: none;
            /* Firefox */
        }

        body::-webkit-scrollbar {
            display: none;
        }

        /* ————— Scroll Container ————— */
        #scroll-container {
            height: 600vh;
            /* 6 sectors × 100vh */
            position: relative;
            pointer-events: none;
        }

        /* ————— Three.js Canvas ————— */
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        /* ————— Fixed Navbar ————— */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(0, 0, 4, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            pointer-events: auto;
            transition: background 0.3s;
        }

        .navbar .logo {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ff8844, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .navbar .logo span {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.4);
            -webkit-text-fill-color: rgba(255, 255, 255, 0.4);
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
            font-size: 13px;
            font-weight: 450;
            letter-spacing: 0.2px;
        }

        .nav-links a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.25s, transform 0.2s;
            cursor: pointer;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
        }

        .nav-links a:hover {
            color: #fff;
        }
        .nav-links a.active {
            color: #fff;
            border-bottom-color: #ff8844;
        }

        /* ————— Sidebar Dots ————— */
        .sidebar-dots {
            position: fixed;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 90;
            display: flex;
            flex-direction: column;
            gap: 14px;
            pointer-events: auto;
        }

        .sidebar-dots .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            position: relative;
        }

        .sidebar-dots .dot.active {
            background: #ff8844;
            border-color: #ff8844;
            box-shadow: 0 0 16px rgba(255, 136, 68, 0.35);
            transform: scale(1.3);
        }

        .sidebar-dots .dot .dot-tooltip {
            position: absolute;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 4, 0.8);
            backdrop-filter: blur(8px);
            padding: 4px 14px;
            border-radius: 6px;
            font-size: 11px;
            color: #fff;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .sidebar-dots .dot:hover .dot-tooltip {
            opacity: 1;
        }

        .sidebar-dots .dot .dot-tooltip::after {
            content: '';
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            border-left: 6px solid rgba(0, 0, 4, 0.8);
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        /* ————— Scroll Progress Bar ————— */
        .scroll-progress {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 3px;
            z-index: 100;
            background: linear-gradient(90deg, #ff6b35, #ff8844, #ffd93d, #a78bfa, #6bcbff);
            width: 0%;
            transition: width 0.08s linear;
            border-radius: 0 3px 3px 0;
            box-shadow: 0 0 20px rgba(255, 136, 68, 0.2);
        }

        /* ————— Scroll Hint ————— */
        .scroll-hint {
            position: fixed;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            color: rgba(255, 255, 255, 0.3);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: floatHint 2.4s ease-in-out infinite;
            pointer-events: none;
            transition: opacity 0.8s ease;
            font-weight: 300;
        }

        .scroll-hint.hidden {
            opacity: 0;
        }

        @keyframes floatHint {
            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-8px);
            }
        }

        /* ————— Glass Content Panel ————— */
        .content-panel {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%) scale(0.92);
            z-index: 40;
            max-width: 640px;
            width: 90%;
            padding: 32px 40px;
            background: rgba(0, 0, 4, 0.55);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.04);
            opacity: 0;
            transition: opacity 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            text-align: center;
        }

        .content-panel.visible {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            pointer-events: auto;
        }

        .content-panel .panel-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 4px 16px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 12px;
        }

        .content-panel .panel-title {
            font-size: 28px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 30%, rgba(255, 255, 255, 0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .content-panel .panel-desc {
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 16px;
            font-weight: 350;
        }

        .content-panel .panel-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .content-panel .panel-tags span {
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            padding: 4px 14px;
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 0.2px;
        }

        .content-panel .panel-tags span.highlight {
            background: rgba(255, 136, 68, 0.12);
            border-color: rgba(255, 136, 68, 0.2);
            color: #ff8844;
        }

        /* ————— Responsive ————— */
        @media (max-width: 768px) {
            .navbar {
                padding: 14px 20px;
            }
            .navbar .logo {
                font-size: 17px;
            }
            .nav-links {
                gap: 14px;
                font-size: 11px;
            }
            .nav-links a {
                padding: 2px 0;
            }
            .sidebar-dots {
                right: 14px;
                gap: 12px;
            }
            .sidebar-dots .dot {
                width: 8px;
                height: 8px;
            }
            .content-panel {
                bottom: 80px;
                padding: 24px 24px;
                max-width: 92%;
            }
            .content-panel .panel-title {
                font-size: 22px;
            }
            .content-panel .panel-desc {
                font-size: 14px;
            }
            .scroll-hint {
                font-size: 11px;
                bottom: 32px;
            }
            .sidebar-dots .dot .dot-tooltip {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .navbar {
                padding: 12px 16px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .navbar .logo {
                font-size: 15px;
            }
            .nav-links {
                gap: 10px;
                font-size: 10px;
                flex-wrap: wrap;
            }
            .content-panel {
                bottom: 64px;
                padding: 20px 18px;
            }
            .content-panel .panel-title {
                font-size: 19px;
            }
            .content-panel .panel-desc {
                font-size: 13px;
            }
            .content-panel .panel-tags span {
                font-size: 10px;
                padding: 3px 10px;
            }
        }

        /* ————— Reduced Motion ————— */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
            .scroll-hint {
                animation: none;
            }
            .content-panel {
                transition: opacity 0.2s ease, transform 0.2s ease;
            }
        }
    </style>
</head>
<body>

    <!-- Scroll Container (drives camera) -->
    <div id="scroll-container"></div>

    <!-- Three.js Canvas -->
    <div id="three-canvas"></div>

    <!-- Fixed Navbar -->
    <nav class="navbar" id="navbar">
        <div class="logo">iMENA <span>Tech</span></div>
        <ul class="nav-links" id="navLinks">
            <li><a data-sector="0">Origin</a></li>
            <li><a data-sector="1">Websites</a></li>
            <li><a data-sector="2">Web Apps</a></li>
            <li><a data-sector="3">Systems</a></li>
            <li><a data-sector="4">AI</a></li>
            <li><a data-sector="5">Hub</a></li>
        </ul>
    </nav>

    <!-- Sidebar Dots -->
    <div class="sidebar-dots" id="sidebarDots"></div>

    <!-- Scroll Progress -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Scroll Hint -->
    <div class="scroll-hint" id="scrollHint">⬇ Scroll to explore</div>

    <!-- Glass Content Panel -->
    <div class="content-panel" id="contentPanel">
        <div class="panel-tag" id="panelTag">SECTOR</div>
        <div class="panel-title" id="panelTitle">Origin</div>
        <div class="panel-desc" id="panelDesc">Welcome to the iMENA Tech universe.</div>
        <div class="panel-tags" id="panelTags"></div>
    </div>

    <!-- ————— Three.js ————— -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // IMPORTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // SECTOR DATA
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const SECTORS = [{
            id: 0,
            name: 'Origin',
            color: '#888888',
            pos: [0, 0, 0],
            radius: 0,
            desc: 'Welcome to the iMENA Tech universe. Scroll to begin your journey.',
            tags: [],
            planet: false,
        }, {
            id: 1,
            name: 'Websites',
            color: '#ff6b35',
            pos: [1.8, -0.4, -14],
            radius: 1.0,
            desc: 'Fast, responsive, SEO-optimized web experiences with premium UX.',
            tags: ['Next.js', 'Tailwind', 'Vercel', 'SEO'],
            planet: true,
        }, {
            id: 2,
            name: 'Web Apps',
            color: '#6bcbff',
            pos: [-1.4, 0.7, -28],
            radius: 1.2,
            desc: 'Interactive portals, dashboards, and SaaS platforms with real-time data.',
            tags: ['React', 'TypeScript', 'Node.js', 'PostgreSQL'],
            planet: true,
        }, {
            id: 3,
            name: 'Systems',
            color: '#ffd93d',
            pos: [2.0, -0.6, -42],
            radius: 1.0,
            desc: 'Enterprise-grade admin tools, management systems, and scalable infrastructure.',
            tags: ['Prisma', 'Supabase', 'Docker', 'APIs'],
            planet: true,
        }, {
            id: 4,
            name: 'AI Solutions',
            color: '#a78bfa',
            pos: [-1.6, 0.4, -56],
            radius: 1.3,
            desc: 'Smart assistants, automated workflows, and predictive analytics.',
            tags: ['OpenAI', 'LangChain', 'Vector DB', 'RAG'],
            planet: true,
        }, {
            id: 5,
            name: 'iMENA Hub',
            color: '#ff8844',
            pos: [0, 0, -72],
            radius: 1.6,
            desc: 'Building a smarter digital future. Websites · Web Apps · Systems · AI.',
            tags: ['Innovation', 'Excellence', 'Future-ready'],
            planet: true,
        }, ];

        const SECTOR_COUNT = SECTORS.length;
        const PLANET_SECTORS = SECTORS.filter(s => s.planet);
        const SECTOR_Z = SECTORS.map(s => s.pos[2]);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // DOM REFS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const container = document.getElementById('three-canvas');
        const scrollContainer = document.getElementById('scroll-container');
        const progressBar = document.getElementById('scrollProgress');
        const sidebarDots = document.getElementById('sidebarDots');
        const navLinks = document.getElementById('navLinks');
        const panel = document.getElementById('contentPanel');
        const panelTag = document.getElementById('panelTag');
        const panelTitle = document.getElementById('panelTitle');
        const panelDesc = document.getElementById('panelDesc');
        const panelTags = document.getElementById('panelTags');
        const scrollHint = document.getElementById('scrollHint');

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // SETUP SIDEBAR DOTS & NAV
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        SECTORS.forEach((s, i) => {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.dataset.index = i;
            const tip = document.createElement('span');
            tip.className = 'dot-tooltip';
            tip.textContent = s.name;
            dot.appendChild(tip);
            dot.addEventListener('click', () => jumpToSector(i));
            sidebarDots.appendChild(dot);
        });

        document.querySelectorAll('.nav-links a').forEach((a, i) => {
            a.addEventListener('click', (e) => {
                e.preventDefault();
                jumpToSector(i);
            });
        });

        function jumpToSector(index) {
            const clamped = Math.max(0, Math.min(SECTOR_COUNT - 1, index));
            const progress = clamped / (SECTOR_COUNT - 1);
            const targetScroll = progress * (scrollContainer.scrollHeight - window.innerHeight);
            window.scrollTo({ top: targetScroll, behavior: 'smooth' });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // THREE.JS SCENE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000004);
        scene.fog = new THREE.Fog(0x000004, 30, 90);

        // Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 1.2, 6);
        camera.lookAt(0, 0, -10);

        // Renderer
        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            powerPreference: 'high-performance',
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // CSS2 Renderer (labels)
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // POST-PROCESSING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const composer = new EffectComposer(renderer);
        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.6, // strength
            0.3, // radius
            0.1 // threshold
        );
        composer.addPass(bloomPass);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // LIGHTS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const ambientLight = new THREE.AmbientLight(0x222244, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.PointLight(0xff8844, 80, 60);
        sunLight.position.set(0, 0, 0);
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.3);
        fillLight.position.set(5, 8, -10);
        scene.add(fillLight);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // SUN
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const sunGeo = new THREE.SphereGeometry(2.8, 48, 48);
        const sunMat = new THREE.MeshStandardMaterial({
            color: 0xff8844,
            emissive: 0xff5500,
            emissiveIntensity: 2.5,
            roughness: 0.1,
            metalness: 0.0,
        });
        const sun = new THREE.Mesh(sunGeo, sunMat);
        sun.position.set(0, 0, 0);
        scene.add(sun);

        // Sun glow sprite
        const glowTexture = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
            grad.addColorStop(0, 'rgba(255,136,68,1)');
            grad.addColorStop(0.15, 'rgba(255,100,40,0.8)');
            grad.addColorStop(0.5, 'rgba(255,60,20,0.3)');
            grad.addColorStop(1, 'rgba(255,40,10,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 256, 256);
            return new THREE.CanvasTexture(canvas);
        })();

        const glowSprite = new THREE.Sprite(
            new THREE.SpriteMaterial({
                map: glowTexture,
                transparent: true,
                blending: THREE.AdditiveBlending,
                opacity: 0.9,
                depthWrite: false,
            })
        );
        glowSprite.scale.set(18, 18, 1);
        sun.add(glowSprite);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // PLANETS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const planets = [];
        const planetMeshes = [];

        PLANET_SECTORS.forEach((s) => {
            const color = new THREE.Color(s.color);
            const geo = new THREE.SphereGeometry(s.radius, 48, 48);
            const mat = new THREE.MeshStandardMaterial({
                color: color,
                emissive: color,
                emissiveIntensity: 0.15,
                roughness: 0.35,
                metalness: 0.2,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(s.pos[0], s.pos[1], s.pos[2]);
            mesh.userData.sectorId = s.id;
            scene.add(mesh);
            planetMeshes.push(mesh);

            // Ring / glow around planet
            const ringGeo = new THREE.SphereGeometry(s.radius * 1.35, 32, 32);
            const ringMat = new THREE.MeshBasicMaterial({
                color: color,
                transparent: true,
                opacity: 0.08,
                wireframe: true,
                depthWrite: false,
            });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.copy(mesh.position);
            scene.add(ring);

            // Store for animation
            planets.push({
                mesh,
                ring,
                sector: s,
                rotSpeed: 0.08 + Math.random() * 0.12,
                orbitSpeed: 0.02 + Math.random() * 0.03,
                orbitOffset: Math.random() * Math.PI * 2,
                basePos: new THREE.Vector3(s.pos[0], s.pos[1], s.pos[2]),
            });

            // ── CSS2D Label ──
            const labelDiv = document.createElement('div');
            labelDiv.textContent = s.name;
            labelDiv.style.color = '#fff';
            labelDiv.style.fontFamily = 'Inter, sans-serif';
            labelDiv.style.fontSize = '15px';
            labelDiv.style.fontWeight = '500';
            labelDiv.style.letterSpacing = '0.5px';
            labelDiv.style.textShadow = '0 0 30px rgba(0,0,0,0.9), 0 0 60px rgba(0,0,0,0.6)';
            labelDiv.style.background = 'rgba(0,0,4,0.35)';
            labelDiv.style.backdropFilter = 'blur(6px)';
            labelDiv.style.padding = '6px 18px';
            labelDiv.style.borderRadius = '40px';
            labelDiv.style.border = '1px solid rgba(255,255,255,0.06)';
            labelDiv.style.pointerEvents = 'none';
            labelDiv.style.transition = 'opacity 0.4s, transform 0.4s';

            const label = new CSS2DObject(labelDiv);
            label.position.set(s.pos[0], s.pos[1] + s.radius + 1.2, s.pos[2]);
            scene.add(label);
            mesh.userData.label = label;
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // STARS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const starCount = Math.min(6000, window.innerWidth < 768 ? 3000 : 6000);
        const starGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(starCount * 3);
        const starSizes = new Float32Array(starCount);
        const starColors = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount; i++) {
            const r = 20 + Math.random() * 70;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            starPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            starPos[i * 3 + 1] = r * Math.cos(phi) * 0.4;
            starPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta) - 20;
            starSizes[i] = 0.5 + Math.random() * 1.5;
            const c = 0.5 + Math.random() * 0.5;
            starColors[i * 3] = c;
            starColors[i * 3 + 1] = c;
            starColors[i * 3 + 2] = c + Math.random() * 0.2;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        starGeo.setAttribute('size', new THREE.BufferAttribute(starSizes, 1));
        starGeo.setAttribute('color', new THREE.BufferAttribute(starColors, 3));

        const starMat = new THREE.PointsMaterial({
            size: 0.25,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true,
            vertexColors: true,
            depthWrite: false,
        });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // DUST PARTICLES
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const dustCount = Math.min(2000, window.innerWidth < 768 ? 1000 : 2000);
        const dustGeo = new THREE.BufferGeometry();
        const dustPos = new Float32Array(dustCount * 3);
        const dustSizes = new Float32Array(dustCount);
        const dustVel = [];

        for (let i = 0; i < dustCount; i++) {
            dustPos[i * 3] = (Math.random() - 0.5) * 80;
            dustPos[i * 3 + 1] = (Math.random() - 0.5) * 30;
            dustPos[i * 3 + 2] = (Math.random() - 0.5) * 80 - 20;
            dustSizes[i] = 0.03 + Math.random() * 0.08;
            dustVel.push({
                x: (Math.random() - 0.5) * 0.002,
                y: (Math.random() - 0.5) * 0.001,
                z: (Math.random() - 0.5) * 0.002 - 0.003,
            });
        }
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        dustGeo.setAttribute('size', new THREE.BufferAttribute(dustSizes, 1));

        const dustMat = new THREE.PointsMaterial({
            color: 0x8899ff,
            size: 0.08,
            transparent: true,
            opacity: 0.3,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true,
            depthWrite: false,
        });
        const dust = new THREE.Points(dustGeo, dustMat);
        scene.add(dust);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // SCROLL HANDLING
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let currentScrollProgress = 0;
        let targetCameraZ = 6;
        let currentCameraZ = 6;
        let activeSector = 0;

        function updateScroll() {
            const maxScroll = scrollContainer.scrollHeight - window.innerHeight;
            const scrollY = window.scrollY;
            const progress = maxScroll > 0 ? scrollY / maxScroll : 0;
            currentScrollProgress = Math.min(1, Math.max(0, progress));

            // Map progress to camera Z
            const minZ = 6;
            const maxZ = SECTOR_Z[SECTOR_Z.length - 1] - 2;
            targetCameraZ = minZ + (maxZ - minZ) * currentScrollProgress;

            // Update progress bar
            progressBar.style.width = `${currentScrollProgress * 100}%`;

            // Update active sector
            const rawIndex = currentScrollProgress * (SECTOR_COUNT - 1);
            const sectorIndex = Math.round(rawIndex);
            activeSector = Math.min(SECTOR_COUNT - 1, Math.max(0, sectorIndex));

            // Update dots
            document.querySelectorAll('.sidebar-dots .dot').forEach((dot, i) => {
                dot.classList.toggle('active', i === activeSector);
            });

            // Update nav
            document.querySelectorAll('.nav-links a').forEach((a, i) => {
                a.classList.toggle('active', i === activeSector);
            });

            // Update content panel
            updatePanel(activeSector);

            // Scroll hint
            if (currentScrollProgress > 0.05) {
                scrollHint.classList.add('hidden');
            } else {
                scrollHint.classList.remove('hidden');
            }
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // CONTENT PANEL
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        let panelTimeout = null;

        function updatePanel(index) {
            const s = SECTORS[index];
            if (!s) return;

            panelTag.textContent = `SECTOR ${index} · ${s.name.toUpperCase()}`;
            panelTitle.textContent = s.name;

            // Color the title
            const color = new THREE.Color(s.color);
            panelTitle.style.background =
                `linear-gradient(135deg, ${s.color} 20%, ${color.clone().lerp(new THREE.Color(0xffffff), 0.3).getStyle()})`;
            panelTitle.style.webkitBackgroundClip = 'text';
            panelTitle.style.webkitTextFillColor = 'transparent';
            panelTitle.style.backgroundClip = 'text';

            panelDesc.textContent = s.desc;

            panelTags.innerHTML = '';
            if (s.tags && s.tags.length) {
                s.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.textContent = tag;
                    if (['Innovation', 'Excellence', 'Future-ready'].includes(tag)) {
                        span.classList.add('highlight');
                    }
                    panelTags.appendChild(span);
                });
            }

            // Show with a slight delay for smooth transitions
            clearTimeout(panelTimeout);
            panel.classList.remove('visible');
            panelTimeout = setTimeout(() => {
                panel.classList.add('visible');
            }, 50);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // ANIMATION LOOP
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            const dt = Math.min(clock.getDelta(), 0.05);

            // ── Smooth camera ──
            currentCameraZ += (targetCameraZ - currentCameraZ) * 0.07;
            camera.position.z = currentCameraZ;

            // Slight camera bob
            const bob = Math.sin(t * 0.15) * 0.08;
            camera.position.y = 1.2 + bob;

            // Look slightly ahead
            const lookTarget = new THREE.Vector3(0, 0, currentCameraZ - 8);
            camera.lookAt(lookTarget);

            // ── Sun pulse ──
            const pulse = 1 + Math.sin(t * 0.6) * 0.04;
            sun.scale.set(pulse, pulse, pulse);
            sunMat.emissiveIntensity = 2.2 + Math.sin(t * 0.7) * 0.4;

            // ── Planets rotate & orbit ──
            planets.forEach((p, i) => {
                p.mesh.rotation.y += p.rotSpeed * dt * 8;
                p.mesh.rotation.x += p.rotSpeed * dt * 2;
                p.ring.rotation.x += p.rotSpeed * dt * 3;
                p.ring.rotation.z += p.rotSpeed * dt * 2;

                // Tiny orbit wobble
                const wobble = Math.sin(t * p.orbitSpeed + p.orbitOffset) * 0.12;
                const wobbleX = Math.cos(t * p.orbitSpeed * 0.7 + p.orbitOffset) * 0.08;
                p.mesh.position.x = p.basePos.x + wobbleX;
                p.mesh.position.y = p.basePos.y + wobble * 0.5;
                p.ring.position.copy(p.mesh.position);

                // Label follows
                if (p.mesh.userData.label) {
                    const lbl = p.mesh.userData.label;
                    lbl.position.x = p.mesh.position.x;
                    lbl.position.y = p.mesh.position.y + p.sector.radius + 1.2;
                    lbl.position.z = p.mesh.position.z;

                    // Label fade based on distance
                    const dist = Math.abs(p.mesh.position.z - currentCameraZ);
                    const alpha = Math.min(1, Math.max(0, 1 - (dist - 2) / 12));
                    lbl.element.style.opacity = alpha;
                    lbl.element.style.transform = `scale(${0.7 + alpha * 0.3})`;
                }
            });

            // ── Dust drift ──
            const dustPosAttr = dust.geometry.attributes.position;
            const dPos = dustPosAttr.array;
            for (let i = 0; i < dustCount; i++) {
                dPos[i * 3] += dustVel[i].x;
                dPos[i * 3 + 1] += dustVel[i].y;
                dPos[i * 3 + 2] += dustVel[i].z;
                if (dPos[i * 3] > 40) dPos[i * 3] = -40;
                if (dPos[i * 3] < -40) dPos[i * 3] = 40;
                if (dPos[i * 3 + 1] > 15) dPos[i * 3 + 1] = -15;
                if (dPos[i * 3 + 1] < -15) dPos[i * 3 + 1] = 15;
                if (dPos[i * 3 + 2] > 20) dPos[i * 3 + 2] = -60;
                if (dPos[i * 3 + 2] < -60) dPos[i * 3 + 2] = 20;
            }
            dustPosAttr.needsUpdate = true;

            // ── Stars subtle rotation ──
            stars.rotation.y += dt * 0.008;

            // ── Render ──
            composer.render();
            labelRenderer.render(scene, camera);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // RESIZE
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        function onResize() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
            composer.setSize(w, h);
            bloomPass.resolution.set(w, h);
        }

        window.addEventListener('resize', onResize);

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // SCROLL LISTENER
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        window.addEventListener('scroll', updateScroll, { passive: true });
        window.addEventListener('load', () => {
            // Initial update after layout
            setTimeout(updateScroll, 100);
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // KEYBOARD NAV
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                jumpToSector(activeSector + 1);
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                jumpToSector(activeSector - 1);
            } else if (e.key >= '1' && e.key <= '6') {
                const idx = parseInt(e.key) - 1;
                if (idx < SECTOR_COUNT) jumpToSector(idx);
            }
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // REDUCED MOTION
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            document.querySelectorAll('.dot, .nav-links a').forEach(el => {
                el.style.transition = 'none';
            });
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // START
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        animate();
        updateScroll();

        console.log('🌌 iMENA Tech 3D Universe — Scroll to explore!');
    </script>
</body>
</html>
